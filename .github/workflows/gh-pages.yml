name: Gatsby Publish

on:
  push:
    branches:
      - main # 推送到 main 分支时触发
  schedule:
    - cron: '0 0 * * *'  # 每天的UTC时间00:00运行一次

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20   # Gatsby 5 必须用 Node 20 构建
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.ACCESS_TOKEN }}
          publish_dir: ./public
          publish_branch: master    # Pages 从 master 分支提供服务，必须显式指定
